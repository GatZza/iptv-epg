name: Update US Movies EPG

on:
  schedule:
    # Every 6 hours. Cron is UTC; GitHub may delay a few minutes under load.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab
  push:
    branches: [main]
    paths:
      - "build_epg.py"
      - ".github/workflows/update-epg.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build EPG
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: python build_epg.py

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
